<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SiBulat Akhtar V5 Plus</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;background:#86d6ff}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none}header{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px;flex-wrap:wrap}header span,.pill{background:#fffde9;border:3px solid #fff;box-shadow:0 4px 0 #5d77a2;border-radius:20px;padding:8px 12px;font-weight:900;color:#253e6a;font-size:clamp(12px,2.5vw,18px)}button{pointer-events:auto;cursor:pointer;border:0;font-weight:1000}#shoot{position:absolute;bottom:22px;right:20px;border-radius:50%;width:clamp(94px,19vw,135px);height:clamp(94px,19vw,135px);background:linear-gradient(#ffed6b,#ff9a24);border:6px solid white;box-shadow:0 9px 0 #bc5c12,0 14px 25px #3335;color:#5c2600;font-size:clamp(19px,4vw,26px)}#shoot:active{transform:translateY(5px);box-shadow:0 3px 0 #bc5c12}#sound{pointer-events:auto}#mode{position:absolute;bottom:145px;right:20px;background:#e8f7ff;border:4px solid white;border-radius:22px;padding:12px 16px;box-shadow:0 5px 0 #6e9ac5;color:#23466a;font-size:16px;max-width:160px}#mode:active{transform:translateY(3px)}#hint{position:absolute;bottom:32px;left:12px;max-width:45%;background:#fffdeee8;padding:10px 14px;border-radius:18px;color:#34446a;font-size:clamp(12px,2.6vw,17px);font-weight:800}#overlay{position:absolute;inset:0;background:#182b60a8;display:none;align-items:center;justify-content:center;pointer-events:auto}#panel{width:min(90vw,460px);padding:30px 20px;border-radius:30px;background:#fff9e8;border:7px solid white;text-align:center;box-shadow:0 15px 0 #405d91}#panel h1{font-size:clamp(30px,7vw,48px);color:#f08a14;margin:4px}#panel p{font-size:19px;color:#3c5278}#next{background:#5dd88b;color:#194e37;border:4px solid white;border-radius:20px;padding:16px 35px;font-size:23px;box-shadow:0 5px 0 #309455}#title{position:absolute;top:77px;left:50%;transform:translateX(-50%);color:white;text-shadow:0 3px 5px #1c4b82;font-size:clamp(18px,4vw,30px);font-weight:1000;white-space:nowrap}#progress{position:absolute;top:118px;left:50%;transform:translateX(-50%);background:#ffffffd9;border-radius:20px;padding:5px 18px;font-weight:900;color:#304c7a}</style></head><body><canvas id="game"></canvas><div id="ui"><header><span id="lev">🌟 LEVEL 1</span><span id="coins">🪙 0</span><span>♾️ BOLA</span><button class="pill" id="sound">🔊</button></header><div id="title">SIBULAT AKHTAR 🎯</div><div id="progress">🎯 0 / 0</div><div id="hint">👆 Sentuh watak ATAU tekan TEMBAK!</div><button id="mode">🎯 TEMBAK<br>🪃 LASTIK</button><button id="shoot">🎯<br>TEMBAK!</button><div id="overlay"><div id="panel"><h1>HEBAT! ⭐</h1><p id="result">Semua sasaran selesai!</p><button id="next">LEVEL SETERUSNYA ➜</button></div></div></div><script>
const c=document.getElementById('game'),g=c.getContext('2d');let W=0,H=0,dpr=1,level=Math.max(1,+(localStorage.getItem('sibulatV5level')||1)),coins=+(localStorage.getItem('sibulatV5coins')||0),people=[],shots=[],bits=[],texts=[],done=false,muted=false,shotNum=0,last=0,manual=false,drag=null;const $=id=>document.getElementById(id);const colors=['#ff655f','#7a70e8','#35c6a1','#ffb23c','#ff79b3','#4b9de9','#9fca45','#f17b55','#bd86e5'];const themes=[['TAMAN CERIA','#83dafa','#8ad57c'],['RUMAH RIANG','#ffcfad','#f4ad81'],['BANDAR WARNA-WARNI','#9bc6fa','#b1a3db'],['PANTAI GEMBIRA','#89dffc','#f7db8a'],['ISTANA KARTUN','#c7b7ff','#b6e4b2'],['SEKOLAH COMEL','#9ed8f2','#a1cf8b']];const layouts=['baris','zigzag','piramid','bulatan','dua kumpulan','tangga','rawak','gelombang'];const reactions=['PUSING! 🌀','LOMPAT! 🐸','TERGOLEK! 🤣','MENARI! 💃','WOOHOO! 🎉','ALAMAK! 😱','TERBANG! 🚀','TERKEJUT! 😲','BOING! 🪀','HAHAHA! 😆','HOP HOP! 🐰','JATUH DUDUK! 😄'];let audio;function beep(freq=500,dur=.12,type='sine',volume=.12){if(muted)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),a=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(80,freq*.6),audio.currentTime+dur);a.gain.setValueAtTime(volume,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(a);a.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}function rand(seed){let x=Math.sin(seed*129.27+level*79.17)*43758.5453;return x-Math.floor(x)}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function start(){done=false;shots=[];bits=[];texts=[];shotNum=0;let count=Math.min(11,3+Math.floor((level-1)/2));let mode=layouts[(level-1)%layouts.length];people=[];for(let i=0;i<count;i++){let col=i%5,row=Math.floor(i/5),nx=.18+(i+.5)/count*.66,ny=.48+(.13*(i%2));if(mode==='baris'){nx=.12+(i+.5)/count*.76;ny=.64}if(mode==='zigzag'){nx=.12+(i+.5)/count*.76;ny=.47+(i%2)*.2}if(mode==='piramid'){let rows=Math.ceil(Math.sqrt(count*2)),r=Math.floor(Math.sqrt(i)),k=i-r*r;nx=.5+(k-r)*.11;ny=.44+r*.105}if(mode==='bulatan'){let a=i/count*Math.PI*2;nx=.5+Math.cos(a)*.31;ny=.59+Math.sin(a)*.16}if(mode==='dua kumpulan'){nx=(i%2?.72:.28)+(Math.floor(i/2)%3-1)*.085;ny=.51+Math.floor(i/6)*.13+(i%3)*.04}if(mode==='tangga'){nx=.13+(i+.5)/count*.75;ny=.38+(i%5)*.075}if(mode==='rawak'){nx=.14+rand(i*3)*.72;ny=.43+rand(i*3+1)*.27}if(mode==='gelombang'){nx=.13+(i+.5)/count*.75;ny=.55+Math.sin(i*1.7)*.12}people.push({nx,ny,x:0,y:0,i,color:colors[(i+level)%colors.length],hit:false,hitTime:0,react:reactions[(level*3+i*5)%reactions.length],move:(level+i)%5,phase:rand(i+99)*7,face:(i+level)%4})}updateUI();$('overlay').style.display='none'}function updateUI(){$('lev').textContent='🌟 LEVEL '+level;$('coins').textContent='🪙 '+coins;$('progress').textContent='🎯 '+people.filter(p=>p.hit).length+' / '+people.length}function targetPos(p,t){let x=p.nx*W,y=p.ny*H;let m=Math.min(27,W*.035);if(p.move===1)x+=Math.sin(t*1.5+p.phase)*m;if(p.move===2)y+=Math.sin(t*2.1+p.phase)*m*.7;if(p.move===3)x+=Math.cos(t*1.3+p.phase)*m;if(p.move===4){x+=Math.sin(t*1.7+p.phase)*m*.6;y+=Math.cos(t*1.9+p.phase)*m*.5}return{x,y}}function fire(p){if(done)return;let t=performance.now()/1000;let candidates=people.filter(q=>!q.hit);if(!candidates.length)return;if(!p||p.hit)p=candidates[shotNum%candidates.length];shotNum++;let at=targetPos(p,t);shots.push({sx:W*.12,sy:H*.85,tx:at.x,ty:at.y,t:performance.now(),p});beep(420,.09,'triangle');setTimeout(()=>beep(750,.07,'sine',.08),80)}function hit(p){if(p.hit)return;p.hit=true;p.hitTime=performance.now();coins+=10+level;localStorage.setItem('sibulatV5coins',coins);let at=targetPos(p,performance.now()/1000);texts.push({x:at.x,y:at.y-55,s:p.react,t:performance.now()});for(let i=0;i<22;i++){let a=i/22*Math.PI*2;bits.push({x:at.x,y:at.y,vx:Math.cos(a)*(2+Math.random()*4),vy:Math.sin(a)*(2+Math.random()*4)-2,life:45,color:colors[i%colors.length]})}beep(190,.2,'sawtooth',.07);setTimeout(()=>beep(620,.16,'sine',.12),90);updateUI();if(people.every(q=>q.hit)){done=true;setTimeout(()=>{beep(800,.15);setTimeout(()=>beep(1100,.2),170);$('result').textContent=`Level ${level} selesai! ${people.length} watak buat aksi lucu! 🪙 +${people.length*(10+level)}`;$('overlay').style.display='flex'},800)}}function round(x,y,w,h,r,color){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function drawPerson(p,t){let at=targetPos(p,t),x=at.x,y=at.y,s=Math.max(.68,Math.min(1.15,W/650));let elapsed=(performance.now()-p.hitTime)/1000;g.save();g.translate(x,y);if(p.hit){let k=Math.min(1,elapsed/1.1),idx=(level*3+p.i*5)%reactions.length;g.translate(0,-Math.abs(Math.sin(k*Math.PI*2))*22*s);if(idx%4===0)g.rotate(k*Math.PI*1.9);else if(idx%4===1)g.rotate(Math.sin(k*11)*.5);else if(idx%4===2)g.rotate(k*1.3);else g.rotate(Math.sin(k*15)*.3);g.globalAlpha=elapsed>1.2?Math.max(.18,1-(elapsed-1.2)*.9):1}else{g.translate(0,Math.sin(t*2+p.phase)*3*s)}g.scale(s,s);g.fillStyle='#0002';g.beginPath();g.ellipse(0,47,29,8,0,0,7);g.fill();g.strokeStyle='#37486b';g.lineWidth=9;g.lineCap='round';g.beginPath();g.moveTo(-11,22);g.lineTo(-13,43);g.moveTo(11,22);g.lineTo(13,43);g.stroke();g.strokeStyle=p.color;g.lineWidth=12;g.beginPath();g.moveTo(-21,-3);g.lineTo(-31,18);g.moveTo(21,-3);g.lineTo(31,18);g.stroke();round(-24,-15,48,44,14,p.color);round(-18,-10,36,9,4,'#ffffff45');g.fillStyle='#f4ba88';g.beginPath();g.arc(0,-36,25,0,Math.PI*2);g.fill();g.fillStyle='#49372c';g.beginPath();g.ellipse(0,-56,25,10,0,Math.PI,Math.PI*2);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(-9,-38,7,0,7);g.arc(9,-38,7,0,7);g.fill();g.fillStyle='#29344b';g.beginPath();g.arc(-8,-38,3,0,7);g.arc(10,-38,3,0,7);g.fill();g.strokeStyle='#763d3e';g.lineWidth=2.5;g.beginPath();if(p.hit){g.arc(0,-24,6,0,Math.PI*2)}else if(p.face%2){g.arc(0,-29,8,.1,Math.PI-.1)}else{g.moveTo(-7,-26);g.quadraticCurveTo(0,-18,7,-26)}g.stroke();if(p.hit){g.font='25px sans-serif';g.fillText(['⭐','💫','😂','🎉'][(p.i+level)%4],17,-60)}g.restore()}function scenery(t){let theme=themes[Math.floor((level-1)/8)%themes.length];let grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,theme[1]);grad.addColorStop(1,'#fff5d8');g.fillStyle=grad;g.fillRect(0,0,W,H);g.fillStyle='#fff8';for(let i=0;i<6;i++){let x=(i*.23+.07)*W,y=H*(.18+(i%3)*.08);g.beginPath();g.ellipse(x,y,55,19,0,0,7);g.fill()}g.fillStyle=theme[2];g.fillRect(0,H*.73,W,H*.27);for(let i=0;i<9;i++){let x=(i+.4)/9*W;g.fillStyle=i%2?'#ffffff55':'#ffffff30';g.beginPath();g.arc(x,H*.8,17,0,7);g.fill()}if(Math.floor((level-1)/8)%6===2){for(let i=0;i<7;i++){round(i*W/6-15,H*.34-(i%3)*30,Math.max(50,W/8),H*.39,6,['#edacbb','#a2b7eb','#f7d78a'][i%3])}}else if(Math.floor((level-1)/8)%6===3){g.fillStyle='#f6e5a1';g.fillRect(0,H*.75,W,H*.25);g.fillStyle='#4ca8d5';g.fillRect(0,H*.7,W,H*.05)}else{for(let i=0;i<5;i++){let x=(i+.5)*W/5;g.fillStyle='#8b6242';g.fillRect(x-5,H*.58,10,H*.2);g.fillStyle=['#4cc87a','#5dbb74','#79c45b'][i%3];g.beginPath();g.arc(x,H*.56,27,0,7);g.fill()}}g.fillStyle='#fff9';g.font=`900 ${Math.min(20,W*.037)}px system-ui`;g.textAlign='center';g.fillText('🌈 '+theme[0]+' • '+layouts[(level-1)%layouts.length].toUpperCase(),W/2,H*.27)}function draw(t){g.clearRect(0,0,W,H);scenery(t);let sorted=[...people].sort((a,b)=>a.ny-b.ny);for(let p of sorted)drawPerson(p,t);let now=performance.now();for(let i=shots.length-1;i>=0;i--){let s=shots[i],k=Math.min(1,(now-s.t)/420),x=s.sx+(s.tx-s.sx)*k,y=s.sy+(s.ty-s.sy)*k-65*Math.sin(k*Math.PI);g.fillStyle='#ffffff99';g.beginPath();g.arc(x,y,17,0,7);g.fill();g.fillStyle='#fce35d';g.beginPath();g.arc(x,y,12,0,7);g.fill();if(k>=1){hit(s.p);shots.splice(i,1)}}for(let i=bits.length-1;i>=0;i--){let b=bits[i];b.x+=b.vx;b.y+=b.vy;b.vy+=.15;b.life--;g.fillStyle=b.color;g.fillRect(b.x,b.y,7,7);if(b.life<=0)bits.splice(i,1)}for(let i=texts.length-1;i>=0;i--){let q=texts[i],age=(now-q.t)/1000;if(age>1.35){texts.splice(i,1);continue}g.globalAlpha=1-age/1.35;g.font=`1000 ${Math.min(29,W*.06)}px system-ui`;g.textAlign='center';g.lineWidth=5;g.strokeStyle='#fff';g.strokeText(q.s,q.x,q.y-age*60);g.fillStyle='#a42f87';g.fillText(q.s,q.x,q.y-age*60);g.globalAlpha=1}if(drag){g.strokeStyle='#fff';g.lineWidth=5;g.setLineDash([8,7]);g.beginPath();g.moveTo(drag.x,drag.y);g.lineTo(drag.ex,drag.ey);g.stroke();g.setLineDash([])}g.fillStyle='#83512c';g.lineWidth=10;g.strokeStyle='#83512c';g.beginPath();g.moveTo(W*.085,H*.89);g.lineTo(W*.085,H*.78);g.moveTo(W*.085,H*.82);g.lineTo(W*.12,H*.78);g.stroke();g.fillStyle='#ffec6a';g.beginPath();g.arc(W*.12,H*.78,13,0,7);g.fill();requestAnimationFrame(draw)}function selectAt(x,y){let available=people.filter(p=>!p.hit),t=performance.now()/1000;if(!available.length)return;let p=available.reduce((best,p)=>{let a=targetPos(p,t),b=targetPos(best,t);return Math.hypot(a.x-x,a.y-y)<Math.hypot(b.x-x,b.y-y)?p:best});fire(p)}c.addEventListener('pointerdown',e=>{if(done)return;if(!manual){selectAt(e.clientX,e.clientY);return}drag={x:e.clientX,y:e.clientY,ex:e.clientX,ey:e.clientY};try{c.setPointerCapture(e.pointerId)}catch(_){}});c.addEventListener('pointermove',e=>{if(drag){drag.ex=e.clientX;drag.ey=e.clientY}});c.addEventListener('pointerup',e=>{if(!drag||done)return;drag.ex=e.clientX;drag.ey=e.clientY;let dx=drag.ex-drag.x,dy=drag.ey-drag.y;let available=people.filter(p=>!p.hit);if(available.length){let t=performance.now()/1000;let aimX,aimY;if(Math.hypot(dx,dy)<18){aimX=e.clientX;aimY=e.clientY}else{let mag=Math.max(1,Math.hypot(dx,dy));aimX=W*.12-dx/mag*W*.75;aimY=H*.85-dy/mag*H*.55}let p=available.reduce((best,p)=>{let a=targetPos(p,t),b=targetPos(best,t);return Math.hypot(a.x-aimX,a.y-aimY)<Math.hypot(b.x-aimX,b.y-aimY)?p:best});fire(p)}drag=null});c.addEventListener('pointercancel',()=>drag=null);$('mode').onclick=()=>{manual=!manual;drag=null;$('mode').innerHTML=manual?'🪃 LASTIK<br>🎯 TEMBAK':'🎯 TEMBAK<br>🪃 LASTIK';$('shoot').innerHTML=manual?'🪃<br>LASTIK!':'🎯<br>TEMBAK!';$('hint').textContent=manual?'🪃 Tarik jari dan lepaskan. Bola tanpa had!':'👆 Sentuh watak atau tekan TEMBAK! Bola tanpa had!'};$('shoot').onclick=()=>fire();$('next').onclick=()=>{level++;localStorage.setItem('sibulatV5level',level);start()};$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊';if(!muted)beep(850)};start();requestAnimationFrame(draw);
</script></body></html>
