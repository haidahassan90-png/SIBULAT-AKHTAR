<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SiBulat Akhtar — 50 Level Cabaran!</title><style>*{box-sizing:border-box}body{margin:0;background:#152343;font-family:system-ui,Arial,sans-serif;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}button{pointer-events:auto;border:0;border-radius:18px;padding:12px 17px;background:linear-gradient(#fff46b,#ffaf18);box-shadow:0 5px 0 #b76518,0 8px 15px #0004;font-size:18px;font-weight:1000;color:#493015;cursor:pointer}button:active{transform:translateY(4px);box-shadow:0 1px 0 #b76518}#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:6px;align-items:center}.pill{border:3px solid #fff9;border-radius:16px;background:#233b70d9;color:white;padding:8px 12px;font-size:clamp(13px,2.6vw,20px);font-weight:900;text-shadow:1px 2px #0006}#bottom{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:10px}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#101e47aa;pointer-events:auto}#panel{background:linear-gradient(145deg,#fffbe5,#ffe4a0);border:7px solid white;border-radius:30px;padding:22px;max-width:min(92vw,460px);text-align:center;box-shadow:0 16px 0 #10234e,0 25px 70px #0008}h1{font-size:clamp(35px,8vw,57px);color:#ff9b0b;-webkit-text-stroke:2px #74320d;text-shadow:3px 5px #184a9c;margin:5px 0}#panel p{font-size:17px;color:#563e26;font-weight:700;line-height:1.5}#panel button{margin:7px}#toast{position:absolute;top:25%;width:100%;text-align:center;color:#fff;font-size:clamp(24px,6vw,46px);font-weight:1000;text-shadow:3px 4px #123,0 0 15px #f80;pointer-events:none;opacity:0;transition:opacity .15s}#toast.on{opacity:1}#mute{background:linear-gradient(#c8faff,#49c5fa);box-shadow:0 5px 0 #2275a3}</style></head><body><canvas id="game"></canvas><div id="ui"><div id="top"><div class="pill" id="lvl">🏆 Tahap 1</div><div class="pill" id="score">🪙 0</div><div class="pill" id="balls">🎯 6</div><button id="mute">🔊</button></div><div id="toast"></div><div id="bottom"><button id="restart">↻ Ulang</button><button id="next" style="display:none">Tahap Seterusnya ➜</button></div><div id="overlay"><div id="panel"><div style="font-size:54px">🐻🎯✨</div><h1>SiBulat<br>AKHTAR!</h1><p>50 LEVEL CABARAN! Tarik bola dengan jari, sasarkan pak cik kartun dan LEPASKAN! Setiap 10 level ada dunia baharu! Pak cik bergerak, melompat dan ada BOS yang perlu dilastik beberapa kali! 🤣</p><button id="play">▶ MULA MAIN</button><button id="levels">🗺️ PILIH LEVEL</button><p style="font-size:13px">🔊 Hidupkan bunyi untuk dengar reaksi lucu!</p></div></div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d');let W=0,H=0,dpr=1,level=1,coins=0,ammo=8,playing=false,drag=false,aim={x:0,y:0},shots=[],particles=[],targets=[],floating=[],time=0,last=0,shake=0,won=false,muted=false,toastTimer=0,audio;let unlocked=1,mode=0,combo=0;try{const save=JSON.parse(localStorage.getItem("sibulatV3")||"{}");unlocked=save.unlocked||1;coins=save.coins||0;level=Math.min(50,unlocked)}catch(e){}const $=id=>document.getElementById(id);const rand=(a,b)=>a+Math.random()*(b-a);function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(playing)placeTargets()}addEventListener('resize',resize);resize();function sound(freq=440,dur=.13,type='sine',vol=.13,slide=0){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur)}catch(e){}}function melody(){[523,659,784,1046].forEach((n,i)=>setTimeout(()=>sound(n,.19,'triangle',.13),i*115))}function hitSound(){sound(180,.24,'sawtooth',.09,-120);setTimeout(()=>sound(480,.15,'sine',.13,-270),80)}function announce(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('on'),1100)}function start(){playing=true;won=false;combo=0;ammo=8+Math.min(Math.floor((level-1)/8),5);shots=[];particles=[];floating=[];$('overlay').style.display='none';$('next').style.display='none';placeTargets();hud();melody()}function placeTargets(){targets=[];mode=Math.floor((level-1)/10);let n=2+Math.min(4,Math.floor((level-1)%10/2));if(level%10===0)n=1;let spacing=Math.min(W*.125,78),cx=W*.67;for(let i=0;i<n;i++){let boss=level%10===0;let hp=boss?3+mode:((level>15&&i%3===0)?2:1);targets.push({x:cx+(i-(n-1)/2)*spacing,y:H*.57+(i%2)*Math.min(32,H*.06),baseX:cx+(i-(n-1)/2)*spacing,baseY:H*.57+(i%2)*Math.min(32,H*.06),color:['#f44848','#a64ee5','#31c86a','#ffad20','#31a5e7','#f36aa6'][i],phase:rand(0,6),state:'idle',timer:0,angle:0,vy:0,dx:0,hit:false,hp,maxHp:hp,boss,scale:boss?1.7:1})}}
function hud(){$('lvl').textContent='🏆 '+level+'/50 · '+['RUMAH','TAMAN','SEKOLAH','BANDAR','ISTANA'][mode];$('score').textContent='🪙 '+coins;$('balls').textContent='🎯 '+ammo}function particle(x,y,col,n=18){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-5,5),vy:rand(-7,1),life:rand(35,65),color:col,r:rand(2,7)})}function fire(){if(!playing||won||ammo<=0)return;const sx=W*.15,sy=H*.77,dx=sx-aim.x,dy=sy-aim.y;let len=Math.hypot(dx,dy);if(len<12)return;ammo--;hud();let speed=Math.min(19,7+len*.095);shots.push({x:sx,y:sy,vx:dx/len*speed,vy:dy/len*speed,life:95,r:Math.max(11,Math.min(W,H)*.023),trail:[]});sound(370,.13,'triangle',.16,-240);setTimeout(()=>sound(170,.16,'sine',.11,-80),90)}function point(e){return{x:e.clientX,y:e.clientY}}c.addEventListener('pointerdown',e=>{if(!playing||won)return;drag=true;aim=point(e);c.setPointerCapture(e.pointerId);sound(300,.04,'sine',.06)});c.addEventListener('pointermove',e=>{if(drag)aim=point(e)});c.addEventListener('pointerup',e=>{if(!drag)return;aim=point(e);drag=false;fire()});c.addEventListener('pointercancel',()=>drag=false);$('play').onclick=start;$('levels').onclick=()=>{const panel=$('panel');panel.innerHTML='<h1>🗺️ 50 LEVEL</h1><p>Pilih tahap yang sudah dibuka!</p><div id="levelGrid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-height:45vh;overflow:auto"></div><button id="back">⬅ KEMBALI</button>';let grid=$('levelGrid');for(let i=1;i<=50;i++){let btn=document.createElement('button');btn.textContent=i<=unlocked?i:'🔒';btn.style.cssText='padding:9px 2px;font-size:15px;border-radius:10px;'+(i>unlocked?'filter:grayscale(1);opacity:.5':'');btn.disabled=i>unlocked;btn.onclick=()=>{level=i;start()};grid.append(btn)}$('back').onclick=()=>{level=Math.min(unlocked,50);start()}};$('restart').onclick=start;$('next').onclick=()=>{level=level===50?1:level+1;start()};$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(!muted)sound(650)};function rr(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function ellipse(x,y,rx,ry,col){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function line(x,y,xx,yy,col,width){ctx.strokeStyle=col;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke()}function bg(){let themes=[['#ffda9a','#ffeecb','#ffbd72','#f6b56c'],['#9ee6ff','#e0ffdc','#73cf7c','#80d68d'],['#d4c2ff','#f8e7ff','#a8a4f2','#bdb7fa'],['#b0e3ff','#ffe4ad','#7db3de','#8dc8ef'],['#f9c4f4','#fff1c2','#cf8fcd','#e7b0e4']];let pal=themes[mode];let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,pal[0]);g.addColorStop(.66,pal[1]);g.addColorStop(.67,'#c5b3a1');g.addColorStop(1,'#7b93b5');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle=pal[2];ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W*.26,0);ctx.lineTo(W*.39,H*.67);ctx.lineTo(0,H*.67);ctx.fill();ctx.fillStyle=pal[3];ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(W*.74,0);ctx.lineTo(W*.64,H*.67);ctx.lineTo(W,H*.67);ctx.fill();rr(W*.35,H*.08,W*.3,H*.58,10,'#dfc5a9');rr(W*.39,H*.12,W*.22,H*.55,8,'#b48f78');rr(W*.41,H*.14,W*.18,H*.51,6,'#7c879e');for(let i=0;i<5;i++){let x=W*(.08+i*.19);line(x,H*.68,W*.5+(x-W*.5)*1.8,H,'#ffffff55',2)}for(let i=0;i<5;i++){let y=H*(.69+i*i*.018);line(0,y,W,y,'#ffffff55',2)}for(let i=0;i<2;i++){let x=i?W*.83:W*.09;rr(x,H*.24,W*.09,H*.3,8,'#8c4f31');rr(x+6,H*.25,W*.09-12,H*.27,4,'#c8eaff');line(x+W*.045,H*.25,x+W*.045,H*.52,'#ffffff77',4)}ellipse(W*.55,H*.82,W*.38,H*.04,'#37456533');ctx.textAlign='center';ctx.font='900 '+Math.min(28,W*.045)+'px system-ui';ctx.fillStyle='#ffffffcc';ctx.fillText(['🏡 RUMAH CERIA','🌳 TAMAN RIANG','🏫 SEKOLAH KARTUN','🏙️ BANDAR WARNA','🏰 ISTANA BINTANG'][mode],W*.52,H*.12)}
function character(t){let s=Math.max(.55,Math.min(W/620,1.15))*1.05;ctx.save();ctx.translate(t.x,t.y+Math.sin(time*.004+t.phase)*3);ctx.scale(s*(t.boss?1.6:1),s*(t.boss?1.6:1));if(t.hit){ctx.translate(t.dx,t.timer*t.vy*.06);ctx.rotate(t.angle)}ellipse(0,68,34,9,'#14233a44');let hoodie=t.color;line(-18,27,-20,56,'#28304c',14);line(18,27,20,56,'#28304c',14);ellipse(-20,58,13,7,'#f8f8ff');ellipse(20,58,13,7,'#f8f8ff');line(-28,-12,-39,18,hoodie,15);line(28,-12,39,18,hoodie,15);ellipse(-40,21,9,9,'#ffd0a3');ellipse(40,21,9,9,'#ffd0a3');rr(-31,-24,62,65,17,hoodie);rr(-9,-8,18,30,6,'#ffffff22');ellipse(0,-49,30,32,'#ffd0a3');ellipse(-11,-51,10,13,'white');ellipse(12,-51,10,13,'white');ellipse(-9,-48,4,6,'#25283e');ellipse(14,-48,4,6,'#25283e');ellipse(0,-36,t.hit?12:7,t.hit?12:5,'#7c2b30');ellipse(0,-27,8,3,'#fff1e6');ctx.fillStyle=hoodie;ctx.beginPath();ctx.arc(0,-68,32,Math.PI,0);ctx.fill();rr(-33,-72,66,8,4,hoodie);if(t.hit){ctx.fillStyle='#fff54b';ctx.font='bold 26px system-ui';ctx.fillText('★',-41,-81);ctx.fillText('★',24,-91)}if(t.hp>1&&!t.hit){ctx.font='bold 20px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('❤️'.repeat(t.hp),0,-105)}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);bg();targets.forEach(character);for(let b of shots){b.trail.forEach((p,i)=>ellipse(p.x,p.y,Math.max(2,b.r*(i+1)/b.trail.length*.5),Math.max(2,b.r*(i+1)/b.trail.length*.5),'#ffffff66'));ellipse(b.x+2,b.y+4,b.r+2,b.r+2,'#263c5999');ellipse(b.x,b.y,b.r,b.r,'#fff');for(let i=0;i<5;i++)line(b.x+Math.cos(i*2.5)*b.r*.3,b.y+Math.sin(i*2.5)*b.r*.3,b.x+Math.cos(i*2.5)*b.r*.8,b.y+Math.sin(i*2.5)*b.r*.8,'#b9c3d5',2)}for(let p of particles){ellipse(p.x,p.y,p.r,p.r,p.color)}let sx=W*.15,sy=H*.77;line(sx-18,sy+60,sx-15,sy-24,'#7b431f',14);line(sx-15,sy-24,sx-38,sy-53,'#9d622d',12);line(sx-15,sy-24,sx+11,sy-56,'#9d622d',12);if(drag){let ax=Math.max(20,Math.min(W*.42,aim.x)),ay=Math.max(H*.32,Math.min(H*.94,aim.y));line(sx-38,sy-53,ax,ay,'#5b3524',5);line(sx+11,sy-56,ax,ay,'#5b3524',5);ellipse(ax,ay,14,14,'#f7f7ff');let dx=sx-ax,dy=sy-ay;for(let i=1;i<=7;i++){let x=sx+dx*i*.25,y=sy+dy*i*.25+(.22*i*i);ellipse(x,y,Math.max(2,5-i*.4),Math.max(2,5-i*.4),'#ffffffbb')}}else{line(sx-38,sy-53,sx-12,sy-28,'#5b3524',5);line(sx+11,sy-56,sx-12,sy-28,'#5b3524',5);ellipse(sx-12,sy-28,14,14,'#fff')}if(playing&&!won&&ammo>0){ctx.font=`900 ${Math.max(14,Math.min(23,W*.035))}px system-ui`;ctx.textAlign='center';ctx.fillStyle='#253968';ctx.fillText('👆 TARIK & LEPASKAN!',W*.21,H*.92)} }
function update(dt){time+=dt*16.67;for(let b of shots){b.trail.unshift({x:b.x,y:b.y});if(b.trail.length>8)b.trail.pop();b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=.17*dt;b.life-=dt;for(let t of targets){if(t.hit)continue;let s=Math.max(.55,Math.min(W/620,1.15))*1.05;let dist=Math.hypot((b.x-t.x)/s,(b.y-(t.y-35*s))/s);if(dist<(t.boss?75:43)){t.hp--;combo++;if(t.hp>0){b.life=0;particle(t.x,t.y-40*s,"#ffe15a",14);sound(330,.14,"square",.08,-100);announce("LAGI "+t.hp+" KALI! 💥");break}t.hit=true;t.timer=0;t.vy=rand(-5,-2);t.dx=rand(-25,25);b.life=0;coins+=10+Math.min(combo,5)*2;shake=8;particle(t.x,t.y-40*s,t.color,25);hitSound();let words=['ADUHH! 🤣','WOOHOO! 😆','ALAMAK! 😵','HAAA! 😲','TERKEJUT! 🤪'];announce(words[Math.floor(rand(0,words.length))]);hud();break}}}shots=shots.filter(b=>b.life>0&&b.x>-40&&b.x<W+40&&b.y<H+50);for(let t of targets)if(!t.hit){let difficulty=(level-1)%10;if(difficulty>=3){t.x=t.baseX+Math.sin(time*.0018*(1+mode*.2)+t.phase)*Math.min(24+difficulty*5,W*.08)}if(difficulty>=6){t.y=t.baseY+Math.sin(time*.0025+t.phase)*Math.min(30,H*.06)}}for(let t of targets)if(t.hit){t.timer+=dt;t.angle=Math.min(1.4,t.timer*.045)*(t.dx>0?1:-1);t.vy+=.16*dt}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.15*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(playing&&!won&&targets.length&&targets.every(t=>t.hit)){won=true;coins+=30+level*2;unlocked=Math.max(unlocked,Math.min(50,level+1));try{localStorage.setItem('sibulatV3',JSON.stringify({unlocked,coins}))}catch(e){}hud();melody();announce('HEBAT AKHTAR! ⭐⭐⭐');$('next').style.display='inline-block';setTimeout(()=>{if(won)showWin()},900)}if(playing&&!won&&ammo===0&&shots.length===0){playing=false;setTimeout(()=>{$('overlay').style.display='flex';$('panel').innerHTML='<div style="font-size:56px">😅🎯</div><h1>CUBA LAGI!</h1><p>Pak cik masih berdiri! Cuba tarik lastik lebih jauh dan sasarkan dengan tepat.</p><button id="again">↻ MAIN SEMULA</button>';$('again').onclick=start},700)}}function showWin(){if(!won)return;$('overlay').style.display='flex';$('panel').innerHTML='<div style="font-size:62px">🏆🎉🌟</div><h1>BERJAYA!</h1><p>Tahap '+level+' selesai! Hebat Akhtar!<br>🪙 Bonus +'+(30+level*2)+' syiling</p><button id="advance">'+(level===50?'🏆 TAMAT! MAIN LAGI':'TAHAP SETERUSNYA ➜')+'</button>';$('advance').onclick=()=>{level=level===50?1:level+1;start()}}function loop(ts){let dt=Math.min((ts-last)/16.67||1,2);last=ts;if(playing||won)update(dt);ctx.save();if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake*=.83;if(shake<.5)shake=0}draw();ctx.restore();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
