<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SiBulat Akhtar</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#9bd9ff;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-weight:900;color:white;text-shadow:0 2px 4px #333;font-size:19px}button{font:900 20px system-ui;border:3px solid #fff;border-radius:18px;padding:12px 22px;background:linear-gradient(#ffe75a,#ffae00);box-shadow:0 5px #a46a10;color:#24305a;cursor:pointer}#menu,#result,#garage{position:fixed;inset:0;background:#173e72aa;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px}#result,#garage{display:none}.panel{background:linear-gradient(#fff9d5,#fff);border:5px solid #fff;border-radius:26px;padding:20px;max-width:420px;width:100%;box-shadow:0 12px 35px #1238}.panel h1{font-size:clamp(35px,9vw,56px);line-height:.95;color:#ffb900;text-shadow:3px 4px #1759b0,-2px -2px white;margin:6px 0 20px}.panel p{color:#345;font-weight:700}.stack{display:grid;gap:12px}.blue{background:linear-gradient(#77dcff,#2388ff);box-shadow:0 5px #16529c}.green{background:linear-gradient(#aaff70,#35c94e);box-shadow:0 5px #1b7c3b}.small{font-size:16px}.balls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}.ball{font-size:30px;background:#e9f5ff;border:3px solid #c0dfff;border-radius:50%;width:62px;height:62px}.chosen{outline:4px solid #ffba00}#hint{position:fixed;bottom:15px;left:0;right:0;text-align:center;color:white;font-weight:800;text-shadow:0 2px 5px #124;background:#164a7b88;padding:9px;pointer-events:none}</style></head><body><canvas id="c"></canvas><div id="hud"><span id="level">⭐ Tahap 1</span><span id="shots">🎯 5</span><span id="coins">🪙 0</span></div><div id="hint">Tarik bola ke belakang, kemudian lepaskan!</div><div id="menu"><div class="panel"><h1>SiBulat<br>AKHTAR 🎯</h1><p>Game lastik kartun yang comel!</p><div class="stack"><button onclick="start()">▶ MAIN</button><button class="blue" onclick="showGarage()">⚽ GARAJ BOLA</button><button class="green" onclick="resetProgress()">↻ MULA SEMULA</button></div><p class="small">Semua watak berpakaian sopan ❤️</p></div></div><div id="result"><div class="panel"><h1 id="resultTitle">BERJAYA! ⭐</h1><p id="resultText"></p><div class="stack"><button onclick="next()">▶ SETERUSNYA</button><button class="blue" onclick="retry()">↻ CUBA LAGI</button><button onclick="home()">⌂ MENU</button></div></div></div><div id="garage"><div class="panel"><h1>GARAJ ⚽</h1><p>Pilih bola lastik!</p><div class="balls" id="ballChoices"></div><button class="blue" onclick="closeGarage()">← KEMBALI</button></div></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let W=0,H=0,dpr=1,level=+(localStorage.saLevel||1),coins=+(localStorage.saCoins||0),ballType=+(localStorage.saBall||0),shots=5,targets=[],particles=[],projectile=null,drag=null,playing=false,finished=false,frame=0;const emojis=['⚪','⚽','🏀','🍉','🌈'];function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function hud(){document.getElementById('level').textContent='⭐ Tahap '+level;document.getElementById('shots').textContent='🎯 '+shots;document.getElementById('coins').textContent='🪙 '+coins}function init(){shots=5;targets=Array.from({length:Math.min(3+Math.floor((level-1)/3),5)},(_,i)=>({x:(i+1)/(Math.min(3+Math.floor((level-1)/3),5)+1),hit:false,wobble:Math.random()*6,shirt:['#ed454c','#8d5be6','#40bf65','#ff9b35','#24a6ce'][i]}));particles=[];projectile=null;finished=false;hud()}function start(){document.getElementById('menu').style.display='none';document.getElementById('result').style.display='none';document.getElementById('garage').style.display='none';playing=true;init()}function home(){playing=false;document.getElementById('result').style.display='none';document.getElementById('menu').style.display='flex'}function retry(){start()}function next(){level++;localStorage.saLevel=level;start()}function resetProgress(){level=1;coins=0;localStorage.saLevel=level;localStorage.saCoins=coins;start()}function showGarage(){document.getElementById('menu').style.display='none';document.getElementById('garage').style.display='flex';document.getElementById('ballChoices').innerHTML=emojis.map((e,i)=>`<button class="ball ${i===ballType?'chosen':''}" onclick="chooseBall(${i})">${e}</button>`).join('')}function chooseBall(i){ballType=i;localStorage.saBall=i;showGarage()}function closeGarage(){document.getElementById('garage').style.display='none';document.getElementById('menu').style.display='flex'}function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function round(x,y,w,h,r,color){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=color;ctx.fill()}function line(x,y,x2,y2,color,width){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke()}function person(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.scale(s,s);let bob=t.hit?Math.sin(frame*.18)*18:Math.sin(frame*.05+t.wobble)*2;ctx.translate(0,bob);if(t.hit)ctx.rotate(Math.sin(frame*.15)*.2);circle(0,5,28,'#35415c22');line(-12,-2,-17,34,'#26344c',13);line(12,-2,17,34,'#26344c',13);round(-26,27,24,10,5,'#fff');round(4,27,24,10,5,'#fff');round(-26,-66,52,65,17,t.shirt);line(-23,-53,-40,-20,t.shirt,15);line(23,-53,40,-20,t.shirt,15);circle(-40,-19,8,'#f7c29a');circle(40,-19,8,'#f7c29a');circle(0,-83,30,'#f7c29a');circle(-10,-87,8,'white');circle(10,-87,8,'white');circle(-8,-86,4,'#29354a');circle(12,-86,4,'#29354a');circle(0,-72,7,'#f3a477');ctx.beginPath();ctx.arc(0,-66,10,0,Math.PI);ctx.strokeStyle='#873b3b';ctx.lineWidth=3;ctx.stroke();round(-30,-115,60,16,8,t.shirt);round(-19,-130,38,22,10,t.shirt);ctx.restore()}function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#b4e7ff');g.addColorStop(.58,'#ffe7bc');g.addColorStop(1,'#c48749');rect(0,0,W,H,g);let vanX=W*.5,vanY=H*.35;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W*.72,vanY);ctx.lineTo(W*.28,vanY);ctx.closePath();ctx.fillStyle='#f8d7a7';ctx.fill();ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(W,H);ctx.lineTo(W*.72,vanY);ctx.lineTo(W*.28,vanY);ctx.closePath();ctx.fillStyle='#e9c9a8';ctx.fill();for(let i=0;i<9;i++){let t=i/9;let yy=vanY+(H-vanY)*t*t;line(W*(.28-.28*t),yy,W*(.72+.28*t),yy,'#bc9e8c',1.5)}for(let i=-5;i<=5;i++){line(vanX+i*W*.044,vanY,vanX+i*W*.25,H,'#c2a38d',1.5)}for(let side of [0,1]){ctx.fillStyle='#e5ad6e';ctx.beginPath();if(side===0){ctx.moveTo(0,0);ctx.lineTo(W*.28,vanY);ctx.lineTo(0,H)}else{ctx.moveTo(W,0);ctx.lineTo(W*.72,vanY);ctx.lineTo(W,H)}ctx.fill();for(let i=0;i<3;i++){let yy=H*(.19+i*.22);let xx=side?W*(.84+i*.04):W*(.16-i*.04);round(xx-24,yy,48,75,4,'#825331');round(xx-18,yy+5,36,65,3,'#5d382b')}}round(W*.43,H*.13,W*.14,H*.22,5,'#8b614c');round(W*.45,H*.15,W*.1,H*.19,3,'#564339')}
function ball(x,y,r){ctx.save();ctx.shadowColor='#2d385777';ctx.shadowBlur=10;circle(x,y,r,'white');ctx.font=`${r*1.7}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(emojis[ballType],x,y+1);ctx.restore()}function draw(){frame++;ctx.clearRect(0,0,W,H);bg();let scale=Math.min(W/450,H/750);targets.forEach(t=>{if(!t.hit)person(W*(.22+t.x*.56),H*.57,Math.max(.52,scale*.75),t)});let baseX=W*.5,baseY=H*.83;line(baseX-28,baseY+40,baseX-22,baseY-38,'#8b5529',12);line(baseX+28,baseY+40,baseX+22,baseY-38,'#8b5529',12);let bx=drag?drag.x:baseX,by=drag?drag.y:baseY-30;line(baseX-22,baseY-38,bx,by,'#52301c',5);line(baseX+22,baseY-38,bx,by,'#52301c',5);if(!projectile)ball(bx,by,19);if(projectile){projectile.x+=projectile.vx;projectile.y+=projectile.vy;projectile.vy+=.24;projectile.life++;ball(projectile.x,projectile.y,Math.max(9,20-projectile.life*.2));if(projectile.life>12){let alive=targets.filter(t=>!t.hit);if(alive.length){let target=alive.reduce((a,b)=>Math.abs(W*(.22+a.x*.56)-projectile.x)<Math.abs(W*(.22+b.x*.56)-projectile.x)?a:b);let tx=W*(.22+target.x*.56),ty=H*.46;if(Math.hypot(projectile.x-tx,projectile.y-ty)<75){target.hit=true;coins+=10;localStorage.saCoins=coins;for(let j=0;j<18;j++)particles.push({x:tx,y:ty,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9,life:40});projectile=null;hud();checkEnd()}}if(projectile&&(projectile.life>95||projectile.y>H+30||projectile.x<0||projectile.x>W)) {projectile=null;checkEnd()}}}particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.13;p.life--;circle(p.x,p.y,Math.max(1,p.life/8),['#ffda24','#ff8b2b','#74d7ff'][p.life%3])});particles=particles.filter(p=>p.life>0);requestAnimationFrame(draw)}function checkEnd(){if(finished)return;if(targets.every(t=>t.hit)){finished=true;playing=false;document.getElementById('resultTitle').textContent='BERJAYA! ⭐';document.getElementById('resultText').textContent='Hebat! Akhtar dapat '+(targets.length*10)+' syiling!';document.getElementById('result').style.display='flex'}else if(shots<=0){finished=true;playing=false;document.getElementById('resultTitle').textContent='CUBA LAGI 💪';document.getElementById('resultText').textContent='Tak apa, cuba sasarkan bola dengan lebih tepat!';document.getElementById('result').style.display='flex';document.querySelector('#result button').style.display='none'}else document.querySelector('#result button').style.display='block'}function pointer(e){return{x:e.clientX,y:e.clientY}}c.addEventListener('pointerdown',e=>{if(!playing||projectile||shots<=0)return;let p=pointer(e);if(p.y<H*.62)return;drag=p;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag)drag=pointer(e)});c.addEventListener('pointerup',e=>{if(!drag)return;let p=pointer(e),dx=W*.5-p.x,dy=H*.83-30-p.y;drag=null;let len=Math.hypot(dx,dy);if(len<15)return;shots--;hud();let targetX=W*(.22+targets.filter(t=>!t.hit)[0].x*.56);let aimX=targetX+(dx/Math.max(len,1))*90;projectile={x:W*.5,y:H*.83-30,vx:(aimX-W*.5)/26,vy:-Math.max(8,Math.min(17,Math.abs(dy)*.13+7)),life:0};});draw();hud();</script></body></html>
